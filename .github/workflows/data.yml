name: Orbites (miroir CelesTrak)
on:
  schedule:
    - cron: '17 */4 * * *'   # toutes les 4 h ; CelesTrak met à jour toutes les 2 h
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/fetch-tle.mjs', '.github/workflows/data.yml']
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Récupérer la branche data existante
        run: git fetch --depth=1 origin data && git worktree add data-branch origin/data || mkdir -p data-branch
      - name: Télécharger les orbites
        run: node scripts/fetch-tle.mjs data-branch
      - name: Publier sur la branche data (sans historique)
        run: |
          cd data-branch
          rm -rf .git 2>/dev/null; rm -f .git
          git init -q -b data
          git config user.name "satsky-bot"
          git config user.email "satsky-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Orbites du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
